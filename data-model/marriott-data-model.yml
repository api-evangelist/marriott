coverage_gap: >-
  The entities a developer would actually want from a hotel group — property, rate plan, room type,
  availability, rate, booking, cancellation, loyalty balance, award redemption — do not exist in any
  published Marriott artifact. The published model covers door locks, file-processing status,
  account merges, internet purchases and room-assignment previews. It is an operations model, not a
  distribution model.
