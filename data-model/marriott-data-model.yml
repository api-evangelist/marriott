summary: >-
  Marriott publishes no object reference. This entity graph is derived entirely from the
  components.schemas of the six mirrored OpenAPI documents. There is no single shared model: each
  document carries its own private schema set with no $ref reuse across documents, so what follows is
  six disjoint island models rather than one estate model. The three identifiers that actually tie
  Marriott's world together — the MARSHA property code, the reservation confirmation number and the
  Bonvoy member account number — appear as bare strings in multiple documents with no shared schema,
  no format, no pattern (except one regex leaked in an error example) and no canonical definition.
