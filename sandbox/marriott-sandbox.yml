provider_sandbox: false
summary: >-
  Marriott publishes no sandbox, no test account, no test credentials, no mock server and no
  developer console. What does exist is an accident of publication: four of the six OpenAPI documents
  Marriott left world-readable on SwaggerHub declare SwaggerHub auto-mock servers, and those mocks are
  live and anonymously callable by anyone. They are operated by SwaggerHub, not by Marriott, and they
  return the example values in Marriott's own specification rather than any Marriott data. This
  artifact records them as a probed fact about the estate — it is deliberately NOT wired as a
  `Sandbox` pointer in apis.yml, because Marriott offers no sandbox and it would be wrong to score one.
test_credentials: null
test_values: null
