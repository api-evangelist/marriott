finding: >-
  A developer cannot test anything Marriott operates. The only anonymously callable endpoints bearing
  Marriott's name are SwaggerHub mocks that Marriott did not intend to publish, and the only Marriott
  hosts that answer are UAT and dev gateways that answer 401.
