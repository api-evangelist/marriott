aid: marriott
name: Marriott International
review:
  question: >-
    Does Marriott International publish a public, self-serve API program, and what would it cost a
    customer or integrator to leave Marriott's distribution and technology relationship?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: hotel-group
  homeMarket: United States
  primaryDomain: marriott.com
findings:
  summary: |
    Marriott International publishes no public developer program. A Broadcom Layer7 API developer
    portal is live at https://devportalprod.marriott.com (HTTP 200) but its anonymous API catalog
    endpoint /api/apis returns an empty item array, and the portal's own home content endpoint
    /content/home returns HTTP 401. There is no self-serve API key, no public API reference, no
    documented rates/availability/booking API, no sandbox, no SDK, no OpenAPI published by Marriott
    on a Marriott host, and no bulk data export operation of any kind.

    The only Marriott OpenAPI documents readable without a contract are eight internal and
    partner-facing specifications left publicly readable on SwaggerHub under the "marriott-api"
    owner. Six of them are mirrored verbatim in openapi/ as evidence; two credential-distribution
    specifications were deliberately not mirrored (see specExposure.notMirrored). Attribution to
    Marriott International is supported by the documents themselves: the commerce-payment-processor
    document names contact "Marriott API Team" at https://api.marriott.com/ with email
    apidevteam@marriott.com and a license named "Marriott Consumer License", and several documents
    name gatewaydsapdev1.marriott.com, gatewaydsaptst1.marriott.com, gatewaydsapuat3.marriott.com
    and *.cld.marriott.com servers.

    Marriott's actual programmatic distribution runs through channels it does not itself document
    publicly: the three global distribution systems, the OTAs, and — for its Homes & Villas
    home-rental inventory — a Channel Connectivity Program that property-management-system and
    channel-manager vendors join by contacting Marriott through a Salesforce partner portal.
  developerPortal:
    url: https://devportalprod.marriott.com/
    httpStatus: 200
    platform: Broadcom (CA) Layer7 API Developer Portal, "atmosphere"/"hermosa" theme
    selfServe: false
    publicCatalogEmpty: true
    evidence:
      - probe: GET https://devportalprod.marriott.com/api/apis
        status: 200
        body: '{"channel":{"title":"APIs","item":[]},"version":"1.0"}'
        note: Anonymous API catalog returns zero APIs. Repeated with ?itemsPerPage=100, same result.
      - probe: GET https://devportalprod.marriott.com/content/home
        status: 401
        note: Portal home content itself requires authentication.
      - probe: GET https://devportalprod.marriott.com/admin
        status: 302
        redirect: https://developers.marriott.com/admin/
        note: >-
          Redirects to developers.marriott.com, which has no DNS A record at all (NXDOMAIN as of
          2026-07-28) — a stale portal configuration.
      - probe: GET https://devportalprod.marriott.com/signup
        status: 200
        note: >-
          Returns the SPA shell that client-side redirects to /#/signup. A signup route exists but no
          public API catalog exists behind it, so signup grants access to nothing that is published.
  probes:
    - url: https://developer.marriott.com
      status: 000
      note: No DNS record.
    - url: https://developers.marriott.com
      status: 000
      note: No DNS record.
    - url: https://api.marriott.com
      status: 000
      note: >-
        DNS CNAME resolves to marriott.lb.apidn.net but no A record and no TCP connection. Cited as a
        contact URL inside Marriott's own OpenAPI documents; not reachable from the public internet.
    - url: https://docs.marriott.com
      status: 000
      note: No DNS record.
    - url: https://apis.marriott.com
      status: 000
      note: No DNS record.
    - url: https://www.marriott.com/developers
      status: 404
    - url: https://www.marriott.com/api
      status: 404
    - url: https://www.marriott.com/docs
      status: 404
    - url: https://www.marriott.com/openapi.json
      status: 404
    - url: https://www.marriott.com/swagger.json
      status: 404
    - url: https://www.marriott.com/api-docs
      status: 500
    - url: https://www.marriott.com/.well-known/security.txt
      status: 200
      note: >-
        Contact https://hackerone.com/marriott; Expires 2026-12-31. A vulnerability disclosure route
        exists; an API documentation route does not.
    - url: https://www.marriott.com/robots.txt
      status: 200
      note: >-
        Disallows /reservation/availabilitySearch.mi, /aries-search/ and all localized /search/ paths.
        Marriott explicitly blocks crawlers from its availability and search surfaces.
    - url: https://devportalprod.marriott.com/openapi.json
      status: 404
    - url: https://devportalprod.marriott.com/swagger.json
      status: 404
    - url: https://devportalprod.marriott.com/api-docs
      status: 404
    - url: https://devportalprod.marriott.com/.well-known/security.txt
      status: 404
    - url: https://homes-and-villas.marriott.com/en/connectivity-partners
      status: 200
    - url: https://homes-and-villas.marriott.com/openapi.json
      status: 404
    - url: https://partners.homes-and-villas.marriott.com/s/connectivity-partner-contact-us
      status: 200
      note: Salesforce Experience Cloud partner contact form; the only published route into the API.
    - url: https://www.travelagents.marriott.com/travelagents/GDSResInfo.mi
      status: 200
    - url: https://www.travelagents.marriott.com/travelagents/internethelpdesk.mi
      status: 200
    - url: https://www.travelagents.marriott.com/travelagents/createAccount.mi
      status: 200
    - url: https://www.marriott.com/en-us/about/terms-of-use.mi
      status: 200
    - url: https://www.marriott.com/loyalty/terms/default.mi
      status: 200
    - url: https://www.marriott.com/about/us-consumer.mi
      status: 200
    - url: https://api.apis.guru/v2/list.json
      status: 200
      note: Zero Marriott entries in the APIs.guru public OpenAPI directory.
    - url: https://api.github.com/orgs/marriott
      status: 404
      note: >-
        Also checked marriottinternational, marriott-international and MarriottInternational — all 404.
        Marriott operates no public GitHub organization.
specExposure:
  source: SwaggerHub public registry, owner "marriott-api"
  discovery: GET https://api.swaggerhub.com/apis/marriott-api?limit=100 -> HTTP 200, totalCount 8
  fetchDate: '2026-07-28'
  uiGated: >-
    The human SwaggerHub UI at https://app.swaggerhub.com/apis/marriott-api/... returns HTTP 302 to
    https://app.swaggerhub.com/apiproxy/sbid/login. The raw specification endpoints on
    api.swaggerhub.com return HTTP 200 anonymously. The documents are therefore machine-readable by
    anyone while appearing gated to a human browser.
  posture: >-
    These are not a developer program. Six are SwaggerHub drafts (X-Published false) and two are
    published versions; all eight are X-Private false, i.e. world-readable. They describe Marriott's
    internal and partner-facing estate, not an offer to third-party developers. They are recorded here
    as evidence of Marriott's real API surface and as a documented exposure, not as an invitation.
