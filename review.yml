switchingCost:
  interfaceShape:
    value: proprietary-undocumented
    standardNamed: none
    evidence: >-
      Marriott publishes no interface contract of any kind for third-party developers. No OpenTravel /
      OTA, HTNG, HEDNA, GIATA or any other hospitality standard is referenced anywhere on marriott.com,
      travelagents.marriott.com, homes-and-villas.marriott.com or devportalprod.marriott.com, and none
      appears in any of the eight harvested OpenAPI documents. The harvested documents are ordinary
      OpenAPI 3.0.x over REST/JSON with Marriott-specific path namespaces (/osd/v1, /loyalty/v1,
      /foundcap/v1, /partners/v1, /v1/hotelops), Marriott-specific header contracts (client_id,
      operator_id, correlation-id) and Marriott-specific enumerations (memberAccountTypeCode "CSID",
      accountStatusTypeCode "23"). The one place Marriott's inventory does meet a shared industry
      contract is the GDS layer, and Marriott does not operate or document that contract — the GDSs do.
    caveat: >-
      The GDS route is standards-mediated and therefore portable, but it is portable between GDSs, not
      away from Marriott. Marriott's own interface is a rebuild in every direction.
  secondSource:
    value: few-alternatives
    alternativesConsidered:
      - Competing hotel groups with actual developer programs — Hilton (developer.hilton.io) is the
        nearest peer that publishes one; IHG, Hyatt, Accor and Wyndham. None of these is a substitute
        for Marriott room inventory; they are substitute inventory.
      - GDS content APIs — Sabre, Amadeus and Travelport all resell Marriott inventory and are
        documented, self-serve-adjacent developer platforms. This is a genuine second route to Marriott
        rooms, at the price of GDS segment economics and no access to Bonvoy member rates.
      - >-
        Bedbanks and OTA APIs — Expedia Rapid, Booking.com Demand API, Hotelbeds. Same trade: Marriott
        rates are reachable, Marriott's loyalty layer is not.
      - Channel managers and PMS vendors for Homes & Villas supply — the 26 named connectivity
        partners are interchangeable with each other, so a property manager has real choice of
        connector while having no choice at all about Marriott being the demand endpoint.
    evidence: >-
      Marriott inventory is obtainable through third parties, so this is not a hard no-alternative;
      but Marriott's own programmatic surface, Bonvoy member rates, member profile, points, digital
      key and direct-booking funnel have no second source whatsoever. There is exactly one supplier of
      Marriott Bonvoy.
  exitPath:
    value: export-on-request
    operationCited: none
    evidence: >-
      No bulk export, dump, reporting or data-portability API operation exists in any published or
      harvested Marriott artifact. The only exit is the consumer privacy right. Marriott's U.S.
      Consumer Privacy Statement (https://www.marriott.com/about/us-consumer.mi, HTTP 200) states
      verbatim - "You may request to access a copy of your Personal Data, including, where applicable,
      a copy of the Personal Data you provided to us in a portable format." That is a manual, per-person,
      request-driven export with no machine interface and no partner or property-level equivalent.
    partnerExit: >-
      Nothing published. There is no documented way for a connectivity partner, franchisee or travel
      agency to extract its own booking, rate, content or performance history from Marriott.
  identifierPortability:
    summary: >-
      Shared industry keys at the distribution edge, Marriott-proprietary keys everywhere behind it.
    shared:
      - GDS two-letter hotel chain codes, published by Marriott itself at
        https://www.travelagents.marriott.com/travelagents/GDSResInfo.mi — AC Hotels AR, Aloft AL,
        Autograph Collection AK, Bvlgari BG, citizenM CU, Courtyard CY, Delta DE, Design Hotels DP,
        EDITION EB, Element EL, Fairfield FN, Four Points FP, Gaylord GE, JW Marriott MC, Le Meridien
        MD, Luxury Collection LC, Marriott Hotels MC, Moxy OX, Protea PR, Renaissance BR, Residence Inn
        RC, Ritz-Carlton RZ, Sheraton SI, SpringHill XV, St. Regis XR, TownePlace TO, Tribute TX, W
        Hotels WH, Westin WI, and others. These travel between Amadeus, Sabre and Travelport unchanged.
      - Marriott's travel-agent portal exposes a component named "newIataSearch" on its GDS pages,
        indicating agency identity in that channel is keyed on IATA agency numbers. Not independently
        confirmed against a rendered form, so recorded as an observation rather than a fact.
    proprietary:
      - MARSHA property codes. Marriott's own page JavaScript declares an "hd_marshaCode" variable in
        its hotel-search variable block on travelagents.marriott.com — the property key is Marriott's,
        not the industry's, even though the industry has adopted it.
      - Marriott Bonvoy member account numbers, and internal member account type codes such as "CSID"
        seen in the account-merge document.
      - Reservation confirmation numbers used as the path key in the Data Collection API.
      - Marriott property codes used as the path key in the property onboarding and credential APIs.
      - Marriott corporate rate codes, ~40 of which are enumerated in plain text in the
        travelagents.marriott.com page variables.
    consequence: >-
      A property or partner can move between GDSs on the chain code. It cannot move a Bonvoy member
      identity, a MARSHA-keyed content record or a Marriott confirmation number anywhere at all.
  contractualLockIn:
    published: partial
    verbatim:
      - source: https://www.marriott.com/en-us/about/terms-of-use.mi
        quote: >-
          "use robots, spiders, or other automatic or high-volume methods or devices, or manual
          processes to access, search, retrieve, index, monitor, scrape, copy or collect data or other
          materials from our sites or the Marriott Information that they contain, or any aspect of the
          Services or the Marriott Information, without our written permission (standard search engine
          technology that links users to our Services is permitted)"
        reading: >-
          Programmatic access to Marriott rate, availability and content data is contractually
          prohibited by default. Because no API is published, "our written permission" is the entire
          access model.
      - source: https://www.marriott.com/loyalty/terms/default.mi
        quote: >-
          "If the Company cancels a Member's Account for any reason, the Member may not reapply for
          membership in the Loyalty Program except in very limited circumstances at Company's sole
          [discretion]"
        reading: Account termination is unilateral and effectively permanent.
      - source: https://www.marriott.com/loyalty/terms/default.mi
        quote: >-
          "Points, Awards and other related benefits and services have no cash value and the Company
          will not compensate or pay cash for any forfeited or unused Points."
        reading: Accrued loyalty value is non-recoverable on exit.
      - source: https://www.marriott.com/loyalty/terms/default.mi
        quote: >-
          "If the Loyalty Program is terminated, all unredeemed Points will be forfeited without any
          obligation or liability, and no Award claims will be honored after the conclusion of the
          notice period."
        reading: >-
          Marriott may terminate the program on six months' notice, or less where law requires, and
          owes nothing for the balance.
      - source: https://www.marriott.com/loyalty/terms/default.mi
        quote: '"Loyalty Program benefits are non-transferable unless expressly stated otherwise."'
    notPublished: >-
      No minimum term, exclusivity clause, full-content agreement, segment fee, termination-notice
      period or API licence is published for any Marriott partner, connectivity or GDS relationship.
      The "Marriott Consumer License" named in the commerce-payment-processor OpenAPI points at
      http://api.marriott.com/license, which does not resolve. No commercial terms are inferred here.
  accessGate:
    value: partner-only
    whatADeveloperMustDo:
      - >-
        For any Marriott API: obtain a Marriott partner relationship. The Layer7 portal at
        devportalprod.marriott.com has a signup route but an empty public catalog and an
        authentication-gated home page, so a self-serve signup grants access to nothing published.
      - >-
        For Homes & Villas by Marriott Bonvoy connectivity: submit the Salesforce partner contact form
        at https://partners.homes-and-villas.marriott.com/s/connectivity-partner-contact-us, or route
        through one of the 26 named connectivity partners (7 designated "Elite Partners" — BookingPal,
        Guesty, Hostfully, Hostify, NextPax, Rentals United, VacayHome Connect). No requirements or
        terms are published on the partner page.
      - >-
        For travel-agency access: register on travelagents.marriott.com, which describes itself as
        "SECURE ACCESS TO ALL OF MARRIOTT'S INTERMEDIARY PARTNER PROGRAMS" and gates commissions,
        commission statements, direct deposit and the Hotel Excellence! training program behind it.
      - >-
        For scraping instead: prohibited by the Terms of Use quoted above without written permission.
    signedArtifact: >-
      Nothing signable is published. There is no downloadable developer agreement, API licence, data
      licence or partner contract anywhere on any Marriott host probed.
  distributionModel:
    value: gds-intermediated
    verbatim: >-
      "Marriott makes it easy for you to do business online by participating in all Global Distribution
      Systems (GDS) which provide real-time rates and availability for all Marriott hotels worldwide.
      ... Marriott participates in the following GDS: Amadeus, Sabre, Travelport (Apollo/Galileo, and
      Worldspan). Each brand has a unique two letter chain code."
      — https://www.travelagents.marriott.com/travelagents/internethelpdesk.mi
    alsoOperates:
      - >-
        Direct: Marriott.com and the Marriott Bonvoy app, with member-rate and points differentiation
        that is unavailable through any intermediary — the explicit direct-booking counterweight to
        OTA intermediation.
      - >-
        Channel manager: the Homes & Villas by Marriott Bonvoy Channel Connectivity Program, through
        which PMS and channel-manager vendors push short-term-rental supply into Marriott's demand.
      - >-
        Aggregator resale: OTA and bedbank channels, undocumented by Marriott.
    ndcPosture: >-
      Not applicable. Marriott is a hotel group, not an airline; IATA NDC does not govern lodging
      distribution and Marriott makes no NDC claim. The lodging analogue would be OpenTravel/OTA or
      HTNG messaging, and Marriott publishes no conformance statement for either.
  theFinding: >-
    Marriott's switching cost is asymmetric by design. Downstream, at the GDS edge, Marriott is
    deliberately standards-portable — two-letter chain codes, present in all three GDSs, so that no
    intermediary can hold its inventory hostage. Upstream, toward anyone who wants to build on
    Marriott, there is nothing to switch away from because there is nothing to switch onto: no public
    API, no published contract, no export, no identifiers that leave the building. The company has
    solved its own lock-in problem and published none of the machinery that would let a partner solve
    theirs.
