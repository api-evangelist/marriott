notes:
  duplicateProviderWarning: >-
    An older provider profile already exists in the network at all/marriott-international with aid
    "marriott-international". Its apis[] entries (Availability API, Properties API, Reservations API,
    all with baseURL https://devportalprod.marriott.com) are AE-derived scaffolding and are not
    supported by anything found in this bootstrap: the portal's anonymous catalog is empty and no
    such documented API exists. That profile should be reconciled against this one — survivor plus
    tombstone — before either is published.
