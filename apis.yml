name: Marriott International
kind: company
description: >-
  Marriott International is the world's largest hotel group by room count, headquartered in Bethesda,
  Maryland, United States, operating and franchising roughly thirty brands from The Ritz-Carlton, St.
  Regis and W through Marriott Hotels, Sheraton, Westin and Courtyard down to Fairfield, Moxy and
  StudioRes, plus the Homes & Villas by Marriott Bonvoy home-rental marketplace and the Marriott Bonvoy
  loyalty program. It sits on the supply side of the travel distribution chain: it publishes rates and
  availability into every major global distribution system — Marriott's own travel-agent site states it
  "participates in the following GDS: Amadeus, Sabre, Travelport (Apollo/Galileo, and Worldspan)" — sells
  through the OTAs, connects short-term-rental supply through a channel-connectivity partner program, and
  spends heavily to pull demand back to direct booking on Marriott.com and the Bonvoy app. Its API posture
  is closed. A Broadcom Layer7 developer portal exists at devportalprod.marriott.com and returns HTTP 200,
  but its anonymous API catalog is literally empty and the portal's own home content returns HTTP 401 —
  there is no self-serve signup, no public API reference, no published rates/availability/booking API, no
  sandbox, no SDK, no changelog and no exit path. The only Marriott OpenAPI documents that can be read
  without a contract are eight internal and partner-facing specifications left publicly readable on
  SwaggerHub under the "marriott-api" owner; six are mirrored here verbatim as evidence. Everything a
  developer would actually want is behind a partner relationship, a travel-agent registration, or a GDS
  or channel-manager contract.
