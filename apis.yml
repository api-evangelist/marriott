  - type: Overlay
    url: overlays/marriott-commerce-payment-processor-overlay.yaml
  - type: APIReference
    url: https://api.swaggerhub.com/apis/marriott-api/commerce-payment-processor/1.0.0
- aid: marriott:marriott-finance-status-notifier-api
  name: Marriott Finance Status Notifier API
  description: >-
    Internal Marriott finance application API that receives processing status for files generated by
    Marriott's finance adapters, with status, data, config-watcher and Spring Boot actuator logger
    operations, secured with an OAuth2 client-credentials flow. This is one of only two Marriott
    SwaggerHub documents marked published rather than draft. No Marriott host is listed as a server.
  humanURL: https://api.swaggerhub.com/apis/marriott-api/finance-all-statusnotifier/1.0.2
  baseURL: https://virtserver.swaggerhub.com/marriott-api/finance-all-statusnotifier/1.0.2
  tags:
