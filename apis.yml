    url: openapi/marriott-finance-status-notifier-api-openapi.json
  - type: Overlay
    url: overlays/marriott-finance-status-notifier-overlay.yaml
  - type: APIReference
    url: https://api.swaggerhub.com/apis/marriott-api/finance-all-statusnotifier/1.0.2
- aid: marriott:marriott-hotel-operations-ara-api
  name: Marriott Hotel Operations ARA Preview Submit API
  description: >-
    Internal Marriott hotel-operations API that submits a preview request for ARA automated room
    assignment. The OpenAPI document declares no servers at all, which is itself the finding — the
    operation is real but no host, environment or access route is published anywhere. Publicly readable
    on SwaggerHub under the "marriott-api" owner.
  humanURL: https://api.swaggerhub.com/apis/marriott-api/hotel-operations-ara-preview-submit-api/1.0.0
