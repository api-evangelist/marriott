apis:
- aid: marriott:marriott-tip-internet-portal-api
  name: Marriott TIP Internet Portal API
  description: >-
    Partner-facing API used by Marriott's in-hotel internet (TIP) provider integration to generate a guest
    landing-page URL, validate a guest's room number and last name against the cloud PMS, and post an
    internet purchase back to the PMS. Bearer and Basic security schemes are declared and an SSO token
    operation is included. This is not part of any public Marriott developer program; the OpenAPI document
    is readable on SwaggerHub under the "marriott-api" owner and the only server it names is a Marriott UAT
    gateway host that is not open to the public.
  humanURL: https://api.swaggerhub.com/apis/marriott-api/tip-internet-portal-api-spec/1.0.2
  baseURL: https://gatewaydsapuat3.marriott.com
  tags:
  - Partners
  - Property Management System
  - Guest Services
  properties:
  - type: OpenAPI
    url: openapi/marriott-tip-internet-portal-api-openapi.json
  - type: Overlay
    url: overlays/marriott-tip-internet-portal-overlay.yaml
  - type: APIReference
    url: https://api.swaggerhub.com/apis/marriott-api/tip-internet-portal-api-spec/1.0.2
- aid: marriott:marriott-loyalty-account-merge-api
  name: Marriott Loyalty Account Merge API
  description: >-
    Internal Marriott Bonvoy loyalty operation that merges or transfers one member profile into another,
    keyed on a member account type code and member account unique identifier. Documented only as an
    OpenAPI document publicly readable on SwaggerHub under the "marriott-api" owner; the only server
    listed is a SwaggerHub auto-mock, so no callable Marriott host is published.
  humanURL: https://api.swaggerhub.com/apis/marriott-api/account-merge/1.0.2
  baseURL: https://virtserver.swaggerhub.com/marriott-api/lylt-v1-merge-profile/1.0.1
  tags:
  - Loyalty
  - Member Profile
  properties:
  - type: OpenAPI
    url: openapi/marriott-loyalty-account-merge-api-openapi.json
  - type: Overlay
    url: overlays/marriott-loyalty-account-merge-overlay.yaml
  - type: APIReference
    url: https://api.swaggerhub.com/apis/marriott-api/account-merge/1.0.2
- aid: marriott:marriott-data-collection-api
  name: Marriott Data Collection API
  description: >-
    Internal Marriott stay-event API that captures and publishes additional event data for a reservation
    confirmation number, described by its own OpenAPI as feeding a downstream consumer called PACD and
    associated with digital-key events. Servers named are SwaggerHub auto-mocks plus Marriott dev and test
    gateway hosts; there is no production or public endpoint. Publicly readable on SwaggerHub under the
    "marriott-api" owner.
  humanURL: https://api.swaggerhub.com/apis/marriott-api/Data_Collection_API/1.0.0
  baseURL: https://gatewaydsapdev1.marriott.com
  tags:
  - Stays
  - Event
  - Digital Key
  tags_raw:
  - Stays
  - Events
  - Digital Key
  properties:
  - type: OpenAPI
    url: openapi/marriott-data-collection-api-openapi.json
  - type: Overlay
    url: overlays/marriott-data-collection-overlay.yaml
  - type: APIReference
    url: https://api.swaggerhub.com/apis/marriott-api/Data_Collection_API/1.0.0
- aid: marriott:marriott-commerce-payment-processor-api
  name: Marriott Commerce Payment Processor API
  description: >-
    Internal Marriott commerce API that submits a payment to a payment processor over an XML FreedomPay
    Freeway service operation. Its OpenAPI info block names the "Marriott API Team" with contact URL
    https://api.marriott.com/ and email apidevteam@marriott.com and a license named "Marriott Consumer
    License" — the only place Marriott's API-team identity is publicly asserted. Declares Basic, Bearer
    and OAuth2 authorization-code security. No public server is listed.
  humanURL: https://api.swaggerhub.com/apis/marriott-api/commerce-payment-processor/1.0.0
  baseURL: https://virtserver.swaggerhub.com/marriott-api/commerce-payment-processor/1.0.0
  tags:
  - Payments
