openapi: 3.2.0
info:
  version: 1.0.2
  title: Finance Status Notifier Application Actuator API
  description: This app will be consumed by Finance system to push the processing status of the files generated by the finance adapters.
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/marriott-api/finance-all-statusnotifier/1.0.2
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/marriott-api/fas-oauthapp/1.0.0 - To be updated
security:
- application:
  - write
tags:
- name: Actuator
paths:
  /actuator/loggers/ROOT:
    post:
      summary: Change ROOT logger level
      description: This operation changes the ROOT log level of the app
      operationId: changeLogger
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoggersResponse'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Invalid Input Data
      tags:
      - Actuator
components:
  schemas:
    LoggersResponse:
      type: object
      properties:
        configuredLevel:
          type: string
  securitySchemes:
    application:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://example.com/oauth/token
          scopes:
            write: allows modifying resources
