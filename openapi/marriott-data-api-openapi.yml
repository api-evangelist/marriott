openapi: 3.2.0
info:
  version: 1.0.2
  title: Finance Status Notifier Application Data API
  description: This app will be consumed by Finance system to push the processing status of the files generated by the finance adapters.
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/marriott-api/finance-all-statusnotifier/1.0.2
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/marriott-api/fas-oauthapp/1.0.0 - To be updated
security:
- application:
  - write
tags:
- name: Data
paths:
  /data:
    post:
      summary: Operation to create/load the performance test data to the respective docdb collection based on the count provided for each adapter
      description: This is to create/load adapter processing status data to perform performance testing based on input count for each adapter provided it is enabled for the environment. It will return the array of property codes for which the data has been created. Property codes should be in the format of GLXXX and BTXXX where XXX is any combination of alphabets only.
      operationId: createAdapterProcessingStatusPefTestData
      requestBody:
        description: Request body detailing what data and how much needs to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfTestData'
        required: true
      responses:
        '200':
          description: Returns an array of property codes for which data is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyCodeArray'
        '400':
          description: Error Ocurred while loading the data in the DB
        '404':
          description: The data endpoint is not available for this environment
      tags:
      - Data
    delete:
      summary: Operation to delete performance test data based on the adapter list provided in the request body
      description: This operation deletes the documents from the document database for the specified adapters.
      operationId: deletePerfTestData
      parameters:
      - name: adapters
        in: query
        schema:
          type: array
          items:
            type: string
        description: List of adapters for which the performance test data should be deleted
        example: BTR,GL
      responses:
        '200':
          description: OK
        '400':
          description: Error in deleting data
        '404':
          description: The data endpoint is not available for this environment
      tags:
      - Data
components:
  schemas:
    PerfTestData:
      type: object
      properties:
        glCount:
          type: integer
          description: Count to add the file processing status for GL
          example: 6
        btrCount:
          type: integer
          description: Count to add the file processing status for BTR
          example: 5
        businessDate:
          type: string
          format: MMDDYYYY
          example: '06112025'
    PropertyCodeArray:
      type: array
      items:
        type: string
        description: Property code in the format GLXXX, OFXXX, or BTXXX where XXX is any combination of alphabets.
      description: Array of Property codes.
      example:
      - GLABC
      - BTRXYZ
  securitySchemes:
    application:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://example.com/oauth/token
          scopes:
            write: allows modifying resources
