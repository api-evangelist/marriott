finding: >-
  The absence is the signal. A company of Marriott's size with an internal API gateway estate, an
  enterprise SSO token service and a Layer7 developer portal ships zero public client libraries,
  because it has zero public APIs for a client library to wrap. The only Marriott "SDKs" in the wild
  are scrapers and browser drivers built by third parties against the consumer website.
