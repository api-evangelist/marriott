summary: >-
  Marriott publishes exactly one machine-readable /.well-known/ document, an RFC 9116 security.txt,
  and it is served identically from the consumer site, the Homes & Villas site and the travel-agent
  site. There is no OpenID Connect discovery document, no RFC 8414 authorization-server metadata, no
  RFC 9727 api-catalog and no ai-plugin.json on any Marriott host — including the three API gateway
  hosts named as servers inside Marriott's own OpenAPI documents. The gateway hosts are live behind
  Akamai (they return real Jetty 404s and set Marriott cookies) but expose no discovery surface at all.
