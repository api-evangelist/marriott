summary: >-
  Marriott publishes no API lifecycle machinery whatsoever — no versioning policy, no deprecation
  policy, no sunset commitment, no changelog, no release notes, no roadmap, no SLA and no status page.
  status.marriott.com does not resolve (no DNS record). The only lifecycle signal that exists is the
  SwaggerHub publication state of the six mirrored documents, and even that contradicts Marriott's
  own posture: four of six are still drafts (X-Published false) yet all are world-readable.
