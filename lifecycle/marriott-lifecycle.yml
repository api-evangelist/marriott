gaps:
- No status page — an integrator cannot learn whether a Marriott gateway is degraded.
- No deprecation policy — a partner has no notice period for a breaking change.
- No changelog — a partner cannot diff what changed between 1.0.0 and 1.0.2.
- No SLA — nothing is committed for availability or support response.
- No roadmap — nothing is signalled about future API surface.
